name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore MeetingMinutes.csproj -PackagesDirectory packages

      - name: Build
        run: msbuild MeetingMinutes.csproj /t:Build /p:Configuration=Release /m /verbosity:minimal
